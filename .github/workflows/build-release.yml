name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DpsDummy
          path: build/libs/*.jar

      - name: Read plugin version
        id: version
        run: echo "version=$(sed -n 's/^version *= *//p' gradle.properties | tr -d ' \r')" >> "$GITHUB_OUTPUT"

      # 태그 푸시뿐 아니라 수동 실행(workflow_dispatch), 기본 브랜치/작업 브랜치 푸시에서도
      # gradle.properties의 버전으로 vX.Y.Z 태그를 만들어 릴리스에 jar를 업로드한다.
      # (같은 버전으로 다시 푸시하면 기존 릴리스의 jar가 교체된다)
      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref, 'refs/heads/claude/')
          ))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          files: build/libs/*.jar
          generate_release_notes: true
